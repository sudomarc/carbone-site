<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>CARBONE — Collectif technologique ouvert</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      width: 1200px;
      height: 630px;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(255, 51, 102, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'%3E%3Cpath d='M 40 0 L 0 0 0 40' fill='none' stroke='%23ffffff' stroke-width='0.3' opacity='0.03'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23grid)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      z-index: 1;
    }

    .logo-mark {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: 48px;
      letter-spacing: -1px;
      color: #ffffff;
      line-height: 1;
    }

    .tagline {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 24px;
      color: #a3a3a3;
      text-align: center;
      max-width: 800px;
      line-height: 1.4;
      z-index: 1;
    }

    .accent-line {
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg, #0066ff, #ff3366);
      border-radius: 2px;
      margin: 32px 0;
      z-index: 1;
    }

    .badges {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 1;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      font-size: 14px;
      color: #e5e5e5;
    }

    .badge svg {
      width: 16px;
      height: 16px;
      fill: #0066ff;
    }

    .badge.accent {
      border-color: rgba(0, 102, 255, 0.3);
      background: rgba(0, 102, 255, 0.1);
    }

    .badge.accent svg {
      fill: #ff3366;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg class="logo-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0066ff" />
          <stop offset="100%" stop-color="#ff3366" />
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="48" stroke="url(#logoGrad)" stroke-width="4" />
      <path d="M30 50 L45 65 L70 35" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="logo-text">CARBONE</span>
  </div>

  <p class="tagline">Collectif technologique ouvert — Nous développons nos propres projets et participons à des collaborations externes.</p>

  <div class="accent-line"></div>

  <div class="badges">
    <span class="badge">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Open source
    </span>
    <span class="badge accent">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Collaborations
    </span>
    <span class="badge">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Indépendance
    </span>
  </div>
</body>
</html>
